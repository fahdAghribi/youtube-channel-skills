<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f13"/>
      <stop offset="1" stop-color="#1f1418"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#d40000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340 M600 0 V340 M700 0 V340 M800 0 V340 M900 0 V340 M1000 0 V340 M1100 0 V340"/>
  </g>

  <!-- Play button -->
  <g transform="translate(80 95)">
    <rect width="200" height="140" rx="36" fill="url(#red)"/>
    <path d="M78 42 L78 98 L132 70 Z" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="330" y="150" font-size="60" font-weight="800" fill="#ffffff">YouTube Channel Skills</text>
  <text x="332" y="198" font-size="24" fill="#c9c9d1">Skills para que un agente gestione tu canal de YouTube,</text>
  <text x="332" y="230" font-size="24" fill="#c9c9d1">de la idea al análisis, con tu aprobación en cada publicación.</text>

  <!-- Pills -->
  <g font-size="15" font-weight="600">
    <g transform="translate(332 262)">
      <rect width="96" height="30" rx="15" fill="#2a2a33"/><text x="48" y="20" text-anchor="middle" fill="#ffb4b4">Idear</text>
    </g>
    <g transform="translate(438 262)">
      <rect width="104" height="30" rx="15" fill="#2a2a33"/><text x="52" y="20" text-anchor="middle" fill="#ffd59e">Producir</text>
    </g>
    <g transform="translate(552 262)">
      <rect width="104" height="30" rx="15" fill="#2a2a33"/><text x="52" y="20" text-anchor="middle" fill="#a8e6b8">Publicar</text>
    </g>
    <g transform="translate(666 262)">
      <rect width="104" height="30" rx="15" fill="#2a2a33"/><text x="52" y="20" text-anchor="middle" fill="#a9d2ff">Comunidad</text>
    </g>
    <g transform="translate(780 262)">
      <rect width="96" height="30" rx="15" fill="#2a2a33"/><text x="48" y="20" text-anchor="middle" fill="#d6b8ff">Medir</text>
    </g>
  </g>
</svg>
